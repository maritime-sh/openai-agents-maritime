[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-maritime"
version = "0.1.0"
description = "Maritime sandboxes for the OpenAI Agents SDK: give every agent its own cloud computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maritime", email = "contact@maritime.sh" }]
requires-python = ">=3.10"
keywords = ["openai", "openai-agents", "agents", "sandbox", "maritime", "cloud computer", "ai agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "openai-agents>=0.24.0,<0.25.0",
    "maritime>=0.11.0,<0.12.0",
]

[project.urls]
Homepage = "https://maritime.sh"
Documentation = "https://maritime.sh/docs"
Repository = "https://github.com/maritime-sh/openai-agents-maritime"
Issues = "https://github.com/maritime-sh/openai-agents-maritime/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_agents_maritime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: runs against a real Maritime account (needs MARITIME_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
exclude = ["assets", ".github", "uv.lock"]
